plugin: amazon.aws.aws_ec2
regions:
  - "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
filters:
  instance-state-name: running
  tag:Name: umoja-application
  tag:Environment: dev
strict: true
hostnames:
  - instance-id
compose:
  ansible_host: private_ip_address
  ansible_ssh_common_args: "'-o ProxyJump=ubuntu@' + lookup('env', 'BASTION_PUBLIC_IP')"
groups:
  umoja: ec2_tags.Name == 'umoja-application' and ec2_tags.Environment == 'dev'
keyed_groups:
  - key: ec2_tags.Environment
    prefix: environment
    separator: _
