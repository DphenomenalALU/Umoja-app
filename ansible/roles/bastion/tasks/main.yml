---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the Umoja reverse proxy
  ansible.builtin.template:
    src: umoja.conf.j2
    dest: /etc/nginx/sites-available/umoja
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Enable the Umoja site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/umoja
    dest: /etc/nginx/sites-enabled/umoja
    state: link
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Keep Nginx enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

# Nginx starts with its default site when it is installed, and the boot script does not reload it.
# Reload on every run so the running process always serves the Umoja proxy, even when no file changed.
- name: Load the Umoja proxy into the running Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  changed_when: false
