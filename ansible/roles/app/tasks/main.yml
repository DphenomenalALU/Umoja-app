---
- name: Create Umoja folder
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy database migration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/migrations/001_initial_schema.sql"
    dest: /tmp/umoja-001_initial_schema.sql
    mode: "0600"

- name: Check database schema
  ansible.builtin.command:
    cmd: >-
      psql "host={{ database_host }} port={{ database_port }} dbname={{ database_name }} user={{ database_user }} sslmode=require"
      -tAc "SELECT to_regclass('public.people');"
  environment:
    PGPASSWORD: "{{ vault_postgres_password }}"
  register: app_schema_check
  changed_when: false
  no_log: true

- name: Apply database schema
  ansible.builtin.command:
    cmd: >-
      psql "host={{ database_host }} port={{ database_port }} dbname={{ database_name }} user={{ database_user }} sslmode=require"
      -v ON_ERROR_STOP=1
      -f /tmp/umoja-001_initial_schema.sql
  environment:
    PGPASSWORD: "{{ vault_postgres_password }}"
  when: app_schema_check.stdout | trim == ""
  changed_when: true
  no_log: true

- name: Create app environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Download Amazon RDS certificate bundle
  ansible.builtin.get_url:
    url: "https://truststore.pki.rds.amazonaws.com/{{ aws_region }}/{{ aws_region }}-bundle.pem"
    dest: "{{ app_dir }}/rds-ca-bundle.pem"
    owner: root
    group: root
    mode: "0644"

- name: Create production Compose file
  ansible.builtin.template:
    src: docker-compose.production.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Authenticate Docker to ECR
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      aws ecr get-login-password --region {{ aws_region }}
      | docker login --username AWS --password-stdin {{ ecr_registry }}
    executable: /bin/bash
  changed_when: false

- name: Pull Umoja ECR image
  ansible.builtin.command:
    cmd: "docker pull {{ app_image }}"
  changed_when: false

- name: Start Umoja application
  block:
    - name: Start application and wait for its health check
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always
        recreate: auto
        wait: true
  rescue:
    - name: Collect safe database health errors
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          docker compose logs --no-color --tail=100 umoja
          | grep -F 'Umoja database health check failed' || true
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      register: app_database_health_errors
      changed_when: false

    - name: Fail with container health details
      ansible.builtin.fail:
        msg: >-
          Umoja did not pass its container health check.
          {{ app_database_health_errors.stdout | default('No database health errors were logged.', true) }}

- name: Wait for application health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/api/health"
    status_code: 200
    return_content: true
  register: app_health_check
  retries: 30
  delay: 2
  until: app_health_check.status == 200
