---
- name: Update package list
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install basic packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - ufw
      - postgresql-client
      - unzip
    state: present

- name: Check whether AWS CLI is installed
  ansible.builtin.command: aws --version
  register: base_aws_cli_check
  changed_when: false
  failed_when: false

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}.zip"
    dest: /tmp/awscliv2.zip
    mode: "0644"
  when: base_aws_cli_check.rc != 0

- name: Extract AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install
  when: base_aws_cli_check.rc != 0

- name: Install AWS CLI v2
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws
  when: base_aws_cli_check.rc != 0

- name: Remove AWS CLI installer files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws
  when: base_aws_cli_check.rc != 0
