name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  build-and-push:
    name: Build and push image to ECR
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Scan image before pushing (Trivy, fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push image to ECR
        run: docker push "$IMAGE"

  deploy:
    name: Deploy with Ansible
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder until the Ansible deployment is merged
        run: echo "Ansible deployment will be added after SUM-03 and SUM-04 are merged."